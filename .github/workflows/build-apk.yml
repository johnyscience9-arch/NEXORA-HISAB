
name: Build NEXORA HISAB APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android Source ZIP
        shell: bash
        run: |
          mkdir -p build-source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android source ZIP not found!"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d build-source

      - name: Locate Android Project
        shell: bash
        run: |
          SETTINGS=$(find build-source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle not found!"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project: $ANDROID_DIR"

      - name: Update Gradle Wrapper
        shell: bash
        run: |
          mkdir -p "$ANDROID_DIR/gradle/wrapper"

          cat > "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload NEXORA HISAB APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-HISAB-APK
          path: build-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
